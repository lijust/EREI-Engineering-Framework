name: Public Kooheji next multi PDF unit vector inventory
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-kooheji-next-brochure-unit-vectors.yml'
      - 'experimental/public_kooheji_next_brochure_unit_vector_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pdf-vector-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf>=1.24,<2' 'requests>=2.31,<3'
      - run: python experimental/public_kooheji_next_brochure_unit_vector_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-vellano-belgravia-lavira-original-unit-pdf-vector-probe
          path: ${{ runner.temp }}/sae_kooheji_next_firstparty_brochure_vector_probe.json
          if-no-files-found: warn
          retention-days: 7
