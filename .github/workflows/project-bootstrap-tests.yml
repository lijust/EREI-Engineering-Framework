name: Project Bootstrap Tests

on:
  pull_request:
    paths:
      - 'tools/bootstrap_project.py'
      - 'tools/tests/**'
      - 'templates/project-bootstrap/**'
      - 'schemas/project-framework.schema.json'
      - 'workflows/project-integration-bootstrap/**'
      - 'adr/ADR-0002-PROJECT-INTEGRATION-CONTRACT.md'
      - '.github/workflows/project-bootstrap-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/bootstrap_project.py'
      - 'tools/tests/**'
      - 'templates/project-bootstrap/**'
      - 'schemas/project-framework.schema.json'
      - 'workflows/project-integration-bootstrap/**'
      - 'adr/ADR-0002-PROJECT-INTEGRATION-CONTRACT.md'

permissions:
  contents: read

jobs:
  bootstrap-self-test:
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Verify local Python
        shell: pwsh
        run: |
          py "-${{ matrix.python-version }}" -c "import sys, encodings, ssl; print(sys.version); print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile bootstrap tool
        shell: pwsh
        run: py "-${{ matrix.python-version }}" -m py_compile tools/bootstrap_project.py
      - name: Parse integration schema
        shell: pwsh
        run: py "-${{ matrix.python-version }}" -m json.tool schemas/project-framework.schema.json
      - name: Run bootstrap unit tests
        shell: pwsh
        run: py "-${{ matrix.python-version }}" -m unittest discover -s tools/tests -p 'test_*.py' -v
