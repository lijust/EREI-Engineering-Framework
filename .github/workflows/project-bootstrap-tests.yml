name: Project Bootstrap Tests

on:
  pull_request:
    paths:
      - 'tools/bootstrap_project.py'
      - 'tools/tests/**'
      - 'templates/project-bootstrap/**'
      - 'schemas/project-framework.schema.json'
      - 'schemas/project-candidate-capabilities.schema.json'
      - 'tools/capability_activation.py'
      - 'workflows/candidate-capability-adoption/**'
      - 'workflows/framework-upgrade/**'
      - 'workflows/router/WORKFLOW.md'
      - 'adr/ADR-0006-CANDIDATE-CAPABILITY-ACTIVATION.md'
      - 'CAPABILITIES.json'
      - 'workflows/project-integration-bootstrap/**'
      - 'adr/ADR-0002-PROJECT-INTEGRATION-CONTRACT.md'
      - '.github/workflows/project-bootstrap-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/bootstrap_project.py'
      - 'tools/tests/**'
      - 'templates/project-bootstrap/**'
      - 'schemas/project-framework.schema.json'
      - 'schemas/project-candidate-capabilities.schema.json'
      - 'tools/capability_activation.py'
      - 'workflows/candidate-capability-adoption/**'
      - 'workflows/framework-upgrade/**'
      - 'workflows/router/WORKFLOW.md'
      - 'adr/ADR-0006-CANDIDATE-CAPABILITY-ACTIVATION.md'
      - 'CAPABILITIES.json'
      - 'workflows/project-integration-bootstrap/**'
      - 'adr/ADR-0002-PROJECT-INTEGRATION-CONTRACT.md'

# Keep every main push run; cancel only older PR matrix runs.
concurrency:
  group: bootstrap-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bootstrap-self-test:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify GitHub-hosted Python
        shell: powershell
        run: |
          python -c "import sys, encodings, ssl; print(sys.version); print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile bootstrap and capability activation tools
        shell: powershell
        run: python -m py_compile tools/bootstrap_project.py tools/capability_activation.py
      - name: Parse integration schemas
        shell: powershell
        run: |
          python -m json.tool schemas/project-framework.schema.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m json.tool schemas/project-candidate-capabilities.schema.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run bootstrap unit tests
        shell: powershell
        # Required, unfiltered Assurance already executes full Python 3.12
        # discovery on every PR/main push. Retain 3.11 full + 3.12 focused.
        run: |
          $version = '${{ matrix.python-version }}'
          if ($version -eq '3.11') {
            python -m unittest discover -s tools/tests -p 'test_*.py' -v
          } elseif ($version -eq '3.12') {
            python -m unittest tools.tests.test_bootstrap_project tools.tests.test_capability_activation -v
          } else {
            throw 'Unsupported Python version for Bootstrap CI'
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
