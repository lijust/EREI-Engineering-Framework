name: Project Bootstrap Tests

on:
  pull_request:
    paths:
      - 'tools/bootstrap_project.py'
      - 'tools/tests/**'
      - 'templates/project-bootstrap/**'
      - 'schemas/project-framework.schema.json'
      - 'schemas/project-candidate-capabilities.schema.json'
      - 'tools/capability_activation.py'
      - 'workflows/candidate-capability-adoption/**'
      - 'workflows/framework-upgrade/**'
      - 'workflows/router/WORKFLOW.md'
      - 'adr/ADR-0006-CANDIDATE-CAPABILITY-ACTIVATION.md'
      - 'CAPABILITIES.json'
      - 'workflows/project-integration-bootstrap/**'
      - 'adr/ADR-0002-PROJECT-INTEGRATION-CONTRACT.md'
      - '.github/workflows/project-bootstrap-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/bootstrap_project.py'
      - 'tools/tests/**'
      - 'templates/project-bootstrap/**'
      - 'schemas/project-framework.schema.json'
      - 'schemas/project-candidate-capabilities.schema.json'
      - 'tools/capability_activation.py'
      - 'workflows/candidate-capability-adoption/**'
      - 'workflows/framework-upgrade/**'
      - 'workflows/router/WORKFLOW.md'
      - 'adr/ADR-0006-CANDIDATE-CAPABILITY-ACTIVATION.md'
      - 'CAPABILITIES.json'
      - 'workflows/project-integration-bootstrap/**'
      - 'adr/ADR-0002-PROJECT-INTEGRATION-CONTRACT.md'

# Preserve every main push evidence run; retire only superseded PR matrix jobs.
# A separate push run-id also prevents GitHub replacing an older pending push.
concurrency:
  group: bootstrap-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bootstrap-self-test:
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Verify local Python
        shell: powershell
        run: |
          py "-${{ matrix.python-version }}" -c "import sys, encodings, ssl; print(sys.version); print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile bootstrap and capability activation tools
        shell: powershell
        run: py "-${{ matrix.python-version }}" -m py_compile tools/bootstrap_project.py tools/capability_activation.py
      - name: Parse integration schemas
        shell: powershell
        run: |
          py "-${{ matrix.python-version }}" -m json.tool schemas/project-framework.schema.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py "-${{ matrix.python-version }}" -m json.tool schemas/project-candidate-capabilities.schema.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run bootstrap unit tests
        shell: powershell
        # Assurance already runs full tool discovery on 3.12 for every PR and
        # main push. Keep full 3.11 coverage plus a focused 3.12 bootstrap check.
        # The independent Assurance status remains required for acceptance.
        run: |
          if ('${{ matrix.python-version }}' -eq '3.11') {
            py "-3.11" -m unittest discover -s tools/tests -p 'test_*.py' -v
          } elseif ('${{ matrix.python-version }}' -eq '3.12') {
            py "-3.12" -m unittest tools.tests.test_bootstrap_project tools.tests.test_capability_activation -v
          } else {
            throw 'No test coverage allocation for this Python version'
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
