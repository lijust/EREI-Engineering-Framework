name: Public Darco original project property JSON API source
on:
  push:
    branches: [experiment/public-scrapling-v05-smoke-20261027]
    paths: [.github/workflows/public-darco-firstparty-property-api.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source-api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/public_darco_original_api_property_catalog.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darco-public-project-property-source-catalog
          path: ${{ runner.temp }}/darco_exact_original_public_api_properties_20261028.json
          if-no-files-found: warn
          retention-days: 3
