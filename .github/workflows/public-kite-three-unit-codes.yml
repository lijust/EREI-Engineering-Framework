name: Public Kite three original coded projects
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-kite-three-unit-codes.yml'
      - 'experimental/public_kite_three_unit_codes.py'
      - 'experimental/public_kite_three_unit_codes_urls.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coded-source-unit-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/public_kite_three_unit_codes.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kite-three-original-unit-code-records
          path: ${{ runner.temp }}/kite-three-original-coded-unit-cards.json
          if-no-files-found: warn
          retention-days: 2
