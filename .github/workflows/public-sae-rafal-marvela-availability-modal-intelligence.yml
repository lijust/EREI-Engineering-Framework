name: SAE site intelligence RAFAL Marvela availability modal
on:
  push:
    branches: [experiment/public-scrapling-v05-smoke-20261027]
    paths:
      - experimental/site_intelligence_rafal_marvela_availability_drilldown.py
      - .github/workflows/public-sae-rafal-marvela-availability-modal-intelligence.yml
permissions:
  contents: read
jobs:
  firstparty-modal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'scrapling[fetchers]==0.5' 'lxml>=5,<7'
          python -m playwright install chromium
      - run: python experimental/site_intelligence_rafal_marvela_availability_drilldown.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rafal-marvela-source-availability-modal-deep-intelligence
          path: ${{ runner.temp }}/rafal-marvela-availability-modal-deep-intelligence.json
          retention-days: 14
