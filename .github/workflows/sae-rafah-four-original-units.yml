name: SAE Rafah four existing project original unit grids
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_rafah_four_original_unit_grids.py
      - .github/workflows/sae-rafah-four-original-units.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser engine
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Parse actual public numbered source tables
        run: python tools/sae_rafah_four_original_unit_grids.py
      - name: Save original HTML fragments and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-rafah-original-four-project-unit-grids
          path: sae-raffah-four-original-unit-tables.json
          retention-days: 7
