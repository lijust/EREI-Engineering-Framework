name: Public Basateen missing 44 Jazan original lot inventory
on:
  push:
    branches: [experiment/public-scrapling-v05-smoke-20261027]
    paths: [experimental/public_sakenreal_basateen_44_87_exact_source.py, .github/workflows/public-basateen-44-source.yml]
permissions:
  contents: read
jobs:
  source-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5' 'lxml>=5,<7' 'beautifulsoup4>=4,<5'
      - run: python experimental/public_sakenreal_basateen_44_87_exact_source.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jazan-basateen-44-original-numbered-land-plots
          path: ${{ runner.temp }}/jazan-basateen-exact-44-87-source-rows.json
          retention-days: 7
