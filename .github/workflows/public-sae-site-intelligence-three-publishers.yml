name: SAE site intelligence V1 firstparty 3 publisher source analysis
on:
  push:
    branches: [experiment/public-scrapling-v05-smoke-20261027]
    paths:
      - experimental/site_intelligence_source_recon_v1.py
      - .github/workflows/public-sae-site-intelligence-three-publishers.yml
permissions:
  contents: read
jobs:
  source-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Scrapling and Chromium
        run: |
          python -m pip install 'scrapling[fetchers]==0.5' 'lxml>=5,<7'
          python -m playwright install chromium --with-deps
      - name: Analyze original firstparty static, browser and XHR layers
        run: python experimental/site_intelligence_source_recon_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-site-intelligence-v1-three-publisher-source-map
          path: ${{ runner.temp }}/sae_site_intelligence_firstparty_three_sites.json
          retention-days: 14
