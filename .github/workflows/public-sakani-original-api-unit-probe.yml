name: Public Sakani original project and unit API probe
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-sakani-original-api-unit-probe.yml'
      - 'experimental/public_sakani_api_original_unit_discovery.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sakani-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5' 'lxml>=5,<7'
      - run: python experimental/public_sakani_api_original_unit_discovery.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakani-public-original-unit-api-evidence
          path: ${{ runner.temp }}/sakani-original-api-shape-probe.json
          if-no-files-found: warn
          retention-days: 7
