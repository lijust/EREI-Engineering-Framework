name: App PR129 Runner Bridge V1

on:
  push:
    branches:
      - 'trial/app-pr129-runner-bridge-v1'
    paths:
      - '.trial/app-pr129-snapshot/**'
      - '.github/workflows/app-pr129-runner-bridge.yml'

permissions:
  contents: read

jobs:
  targeted-snapshot:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout Framework bridge snapshot
        uses: actions/checkout@v4

      - name: Prove exact App blob binding for copied files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE '.trial\app-pr129-snapshot'
          $manifest = Get-Content (Join-Path $root 'snapshot-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.source_commit -ne 'd625e72bec19a6286f469df8deadadff75c91e43') { throw 'App source commit binding drift.' }
          foreach ($property in $manifest.exact_files.PSObject.Properties) {
            $relative = $property.Name.Replace('/', [IO.Path]::DirectorySeparatorChar)
            $path = Join-Path $root $relative
            if (-not (Test-Path $path)) { throw "Snapshot file missing: $($property.Name)" }
            $actual = (git hash-object -- $path).Trim()
            if ($actual -ne $property.Value) {
              throw "Blob mismatch for $($property.Name): observed=$actual expected=$($property.Value)"
            }
            Write-Host "EXACT_BLOB_PASS $($property.Name) $actual"
          }
          Write-Host 'EXACT_APP_CHANGED_CODE_BINDING=PASS'

      - name: Verify local Node
        shell: powershell
        run: |
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run exact portable lifecycle test
        shell: powershell
        run: |
          Set-Location (Join-Path $env:GITHUB_WORKSPACE '.trial\app-pr129-snapshot')
          node tests/portable-host-candidate-builder.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run exact inventory candidate test against bounded seam fixture
        shell: powershell
        run: |
          Set-Location (Join-Path $env:GITHUB_WORKSPACE '.trial\app-pr129-snapshot')
          node tests/inventory-search-host-candidate.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Classify targeted evidence
        shell: powershell
        run: |
          Write-Host 'APP_SHA=d625e72bec19a6286f469df8deadadff75c91e43'
          Write-Host 'EXACT_CHANGED_CODE_BYTES=PASS'
          Write-Host 'PORTABLE_LIFECYCLE_BEHAVIOR=PASS'
          Write-Host 'INVENTORY_PATCH_SEAM_BEHAVIOR=PASS'
          Write-Host 'EVIDENCE_CLASSIFICATION=TARGETED_GREEN_NOT_FULL_APP_SOURCE_GREEN'
          Write-Host 'MERGE_AUTHORITY=false'
