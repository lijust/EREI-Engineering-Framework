name: App PR129 Runner Bridge V1

on:
  push:
    branches:
      - 'trial/app-pr129-runner-bridge-v1'
    paths:
      - '.github/workflows/app-pr129-runner-bridge.yml'

permissions:
  contents: read

env:
  APP_SHA: d625e72bec19a6286f469df8deadadff75c91e43

jobs:
  validate-app-pr129:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout Framework bridge definition
        uses: actions/checkout@v4

      - name: Resolve exact App checkout from local fixed drives
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'erei-app-pr129-validation'
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }

          function Probe-Repo([string]$Source) {
            if (-not (Test-Path (Join-Path $Source '.git'))) { return $false }
            $old = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              $remote = git -C $Source remote get-url origin 2>$null
              if ($LASTEXITCODE -ne 0 -or $remote -notmatch 'lijust[/\\]EREI-App-Google|lijust/EREI-App-Google') { return $false }
              git -C $Source cat-file -e "$env:APP_SHA^{commit}" 2>$null
              if ($LASTEXITCODE -ne 0) { return $false }
              git clone --no-hardlinks --no-checkout $Source $target 2>$null
              return ($LASTEXITCODE -eq 0)
            } finally {
              $ErrorActionPreference = $old
            }
          }

          $resolved = $false
          $drives = @(Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Root -match '^[A-Z]:\\$' })
          foreach ($drive in $drives) {
            Write-Host ("Scanning fixed root {0} for EREI-App-Google directories (depth <= 5)." -f $drive.Root)
            $candidates = @(Get-ChildItem -Path $drive.Root -Directory -Filter 'EREI-App-Google' -Recurse -Depth 5 -ErrorAction SilentlyContinue | Select-Object -First 20)
            foreach ($candidate in $candidates) {
              if (Probe-Repo $candidate.FullName) {
                Write-Host ("Resolved exact App commit from local clone on drive {0}." -f $drive.Name)
                $resolved = $true
                break
              }
              if (Test-Path $target) { Remove-Item -Recurse -Force $target }
            }
            if ($resolved) { break }
          }

          if (-not $resolved) { throw 'APP_EXACT_LOCAL_CLONE_UNAVAILABLE' }
          git -C $target checkout --detach $env:APP_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Exact App SHA checkout failed.' }
          $actual = (git -C $target rev-parse HEAD).Trim()
          if ($actual -ne $env:APP_SHA) { throw "App SHA mismatch: $actual" }
          "APP_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "APP_EXACT_SHA=$actual"

      - name: Verify local Node
        shell: powershell
        run: |
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify portable host candidate lifecycle
        shell: powershell
        run: |
          Set-Location $env:APP_DIR
          npm run check:portable-host-candidate-builder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify migrated inventory-search candidate
        shell: powershell
        run: |
          Set-Location $env:APP_DIR
          npm run check:inventory-search-host-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prove App trial has no src changes
        shell: powershell
        run: |
          Set-Location $env:APP_DIR
          $changed = git diff --name-only 6e827c3222187bf8e99daa4cada70928bc395bb9...$env:APP_SHA -- src/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changed) { throw "Unexpected src changes: $changed" }
          Write-Host 'APP_SRC_DIFF=NONE'
