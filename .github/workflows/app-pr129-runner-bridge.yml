name: App PR129 Runner Bridge V1

on:
  push:
    branches:
      - 'trial/app-pr129-runner-bridge-v1'
    paths:
      - '.github/workflows/app-pr129-runner-bridge.yml'

permissions:
  contents: read

env:
  APP_REPO: lijust/EREI-App-Google
  APP_SHA: d625e72bec19a6286f469df8deadadff75c91e43

jobs:
  validate-app-pr129:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout Framework bridge definition
        uses: actions/checkout@v4

      - name: Resolve exact App checkout without mutating existing workspaces
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_TERMINAL_PROMPT = '0'

          function Invoke-Probe([scriptblock]$Command) {
            $saved = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              & $Command
              return [int]$LASTEXITCODE
            } finally {
              $ErrorActionPreference = $saved
            }
          }

          function Try-LocalSource([string]$Source, [string]$Target, [string]$ExpectedSha) {
            if (-not (Test-Path (Join-Path $Source '.git'))) { return $false }
            $remote = ''
            $saved = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try { $remote = (git -C $Source remote get-url origin 2>$null) } finally { $ErrorActionPreference = $saved }
            if ($LASTEXITCODE -ne 0 -or $remote -notmatch 'lijust[/\\]EREI-App-Google|lijust/EREI-App-Google') { return $false }
            $code = Invoke-Probe { git -C $Source cat-file -e "$ExpectedSha^{commit}" 2>$null }
            if ($code -ne 0) { return $false }
            $code = Invoke-Probe { git clone --no-hardlinks --no-checkout $Source $Target 2>$null }
            return ($code -eq 0)
          }

          $target = Join-Path $env:RUNNER_TEMP 'erei-app-pr129-validation'
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          $resolved = $false

          $workspaceRepoDir = Split-Path $env:GITHUB_WORKSPACE -Parent
          $workRoot = Split-Path $workspaceRepoDir -Parent
          $runnerWorkSource = Join-Path (Join-Path $workRoot 'EREI-App-Google') 'EREI-App-Google'
          if (Try-LocalSource $runnerWorkSource $target $env:APP_SHA) {
            Write-Host 'Resolved exact App SHA from an existing runner-work clone.'
            $resolved = $true
          }

          if (-not $resolved) {
            Write-Host 'Searching Windows user profiles for an existing App clone with the exact commit.'
            $found = @()
            if (Test-Path 'C:\Users') {
              $found = @(Get-ChildItem -Path 'C:\Users' -Directory -Filter 'EREI-App-Google' -Recurse -Depth 5 -ErrorAction SilentlyContinue | Select-Object -First 12)
            }
            foreach ($candidate in $found) {
              if (Try-LocalSource $candidate.FullName $target $env:APP_SHA) {
                Write-Host 'Resolved exact App SHA from an existing user-profile clone.'
                $resolved = $true
                break
              }
              if (Test-Path $target) { Remove-Item -Recurse -Force $target }
            }
          }

          if (-not $resolved) {
            Write-Host 'Trying the Framework checkout-scoped credential.'
            $extraHeader = (git -C $env:GITHUB_WORKSPACE config --local --get http.https://github.com/.extraheader)
            if ($LASTEXITCODE -eq 0 -and $extraHeader) {
              $code = Invoke-Probe { git -c "http.https://github.com/.extraheader=$extraHeader" clone --no-checkout "https://github.com/$env:APP_REPO.git" $target 2>$null }
              if ($code -eq 0) { $resolved = $true }
              elseif (Test-Path $target) { Remove-Item -Recurse -Force $target }
            }
          }

          if (-not $resolved) {
            Write-Host 'Trying Git Credential Manager non-interactively.'
            $code = Invoke-Probe { git -c credential.helper=manager -c credential.interactive=never clone --no-checkout "https://github.com/$env:APP_REPO.git" $target 2>$null }
            if ($code -eq 0) { $resolved = $true }
            elseif (Test-Path $target) { Remove-Item -Recurse -Force $target }
          }

          if (-not $resolved) {
            Write-Host 'Trying an existing machine SSH identity in non-interactive mode.'
            $sshCommand = 'ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new'
            $code = Invoke-Probe { git -c "core.sshCommand=$sshCommand" clone --no-checkout "git@github.com:$env:APP_REPO.git" $target 2>$null }
            if ($code -eq 0) { $resolved = $true }
            elseif (Test-Path $target) { Remove-Item -Recurse -Force $target }
          }

          if (-not $resolved) {
            Write-Host 'Trying an existing GitHub CLI login without exposing credentials.'
            $gh = Get-Command gh -ErrorAction SilentlyContinue
            if ($gh) {
              $code = Invoke-Probe { gh auth status --hostname github.com 1>$null 2>$null }
              if ($code -eq 0) {
                $code = Invoke-Probe { gh repo clone $env:APP_REPO $target -- --no-checkout 2>$null }
                if ($code -eq 0) { $resolved = $true }
                elseif (Test-Path $target) { Remove-Item -Recurse -Force $target }
              }
            }
          }

          if (-not $resolved) {
            throw 'APP_PRIVATE_CLONE_UNAVAILABLE: no exact local clone or existing workflow/GCM/SSH/gh credential can read the private App repo.'
          }

          git -C $target checkout --detach $env:APP_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Exact App SHA checkout failed.' }
          $actual = (git -C $target rev-parse HEAD).Trim()
          if ($actual -ne $env:APP_SHA) { throw "App SHA mismatch: $actual" }
          "APP_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "APP_EXACT_SHA=$actual"

      - name: Verify local Node
        shell: powershell
        run: |
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify portable host candidate lifecycle
        shell: powershell
        run: |
          Set-Location $env:APP_DIR
          npm run check:portable-host-candidate-builder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify migrated inventory-search candidate
        shell: powershell
        run: |
          Set-Location $env:APP_DIR
          npm run check:inventory-search-host-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prove App trial has no src changes
        shell: powershell
        run: |
          Set-Location $env:APP_DIR
          $changed = git diff --name-only 6e827c3222187bf8e99daa4cada70928bc395bb9...$env:APP_SHA -- src/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changed) { throw "Unexpected src changes: $changed" }
          Write-Host 'APP_SRC_DIFF=NONE'
