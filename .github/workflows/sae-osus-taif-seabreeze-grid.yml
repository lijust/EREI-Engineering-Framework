name: SAE Osus two additional existing projects full original cards
on:
  push:
    branches: [sae-source-study-20261029]
    paths: [tools/sae_osus_two_new_existing_original_grid.py, .github/workflows/sae-osus-taif-seabreeze-grid.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - run: python tools/sae_osus_two_new_existing_original_grid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sae-osus-taif-seabreeze2-original-public-cards
          path: sae-osus-taif-seabreeze2-firstparty-grid.json
          retention-days: 7
