name: Task Learning Tests

on:
  pull_request:
    paths:
      - "schemas/task-learning-event.schema.json"
      - "schemas/learning-state.schema.json"
      - "schemas/learning-review.schema.json"
      - "schemas/learning-development-output.schema.json"
      - "schemas/learning-review-defer.schema.json"
      - "tools/task_learning.py"
      - "tools/learning_pattern_analysis.py"
      - "tools/learning_review_debt_gate.py"
      - "tools/learning_effectiveness.py"
      - "tools/learning_development_output.py"
      - "tools/learning_health_dashboard.py"
      - "tools/tests/test_task_learning.py"
      - "tools/tests/test_learning_pattern_analysis.py"
      - "tools/tests/test_learning_governance_extensions.py"
      - "tools/tests/test_learning_health_dashboard.py"
      - "skills/task-learning-capture/**"
      - "workflows/learning-review/**"
      - "workflows/learning-to-development/**"
      - "learning/PATTERN_TAXONOMY.json"
      - "learning/development-outputs/**"
      - "templates/project-bootstrap/.erei/learning/**"
      - "workflows/router/WORKFLOW.md"
      - "agents/chief-engineer/AGENT.md"
      - ".github/workflows/task-learning-tests.yml"
  push:
    branches: [main]
    paths:
      - "schemas/task-learning-event.schema.json"
      - "schemas/learning-state.schema.json"
      - "schemas/learning-review.schema.json"
      - "schemas/learning-development-output.schema.json"
      - "schemas/learning-review-defer.schema.json"
      - "tools/task_learning.py"
      - "tools/learning_pattern_analysis.py"
      - "tools/learning_review_debt_gate.py"
      - "tools/learning_effectiveness.py"
      - "tools/learning_development_output.py"
      - "tools/learning_health_dashboard.py"
      - "tools/tests/test_task_learning.py"
      - "tools/tests/test_learning_pattern_analysis.py"
      - "tools/tests/test_learning_governance_extensions.py"
      - "tools/tests/test_learning_development_output.py"
      - "tools/tests/test_learning_health_dashboard.py"
      - "skills/task-learning-capture/**"
      - "workflows/learning-review/**"
      - "workflows/learning-to-development/**"
      - "learning/PATTERN_TAXONOMY.json"
      - "templates/project-bootstrap/.erei/learning/**"
      - "workflows/router/WORKFLOW.md"
      - "agents/chief-engineer/AGENT.md"
      - ".github/workflows/task-learning-tests.yml"

permissions:
  contents: read

jobs:
  task-learning:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile task learning tooling
        run: python -m py_compile tools/task_learning.py tools/learning_pattern_analysis.py tools/learning_review_debt_gate.py tools/learning_effectiveness.py tools/learning_development_output.py tools/learning_health_dashboard.py tools/tests/test_task_learning.py tools/tests/test_learning_pattern_analysis.py tools/tests/test_learning_governance_extensions.py tools/tests/test_learning_development_output.py tools/tests/test_learning_health_dashboard.py

      - name: Validate JSON schemas parse
        run: |
          python -m json.tool schemas/task-learning-event.schema.json > /dev/null
          python -m json.tool schemas/learning-state.schema.json > /dev/null
          python -m json.tool schemas/learning-review.schema.json > /dev/null
          python -m json.tool schemas/learning-development-output.schema.json > /dev/null
          python -m json.tool schemas/learning-review-defer.schema.json > /dev/null
          python -m json.tool learning/PATTERN_TAXONOMY.json > /dev/null

      - name: Run task learning unit tests
        run: python -m unittest tools.tests.test_task_learning -v

      - name: Run learning pattern analysis tests
        run: python tools/tests/test_learning_pattern_analysis.py

      - name: Run learning governance extension tests
        run: python tools/tests/test_learning_governance_extensions.py

      - name: Run learning development output tests
        run: python tools/tests/test_learning_development_output.py

      - name: Run learning health dashboard tests
        run: python tools/tests/test_learning_health_dashboard.py

  validate-learning-development-outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate published learning development outputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(learning/development-outputs/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Learning Development Outputs published."
            exit 0
          fi
          for file in "${files[@]}"; do
            python tools/learning_development_output.py --input "$file"
          done
