name: SAE Four Existing High Volume Official Asset Discovery
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_four_official_assets_deep.py
      - .github/workflows/sae-four-existing-official-assets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - run: python tools/sae_four_official_assets_deep.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sae-four-existing-official-publisher-assets
          path: sae-four-existing-official-asset-investigation.json
          retention-days: 7
