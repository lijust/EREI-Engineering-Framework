name: SAE five existing developer public inventory discovery (read only)
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_existing_five_publisher_inventory_probe.py
      - .github/workflows/sae-five-developer-public-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Read original publisher public inventory and API shapes only
        run: python tools/sae_existing_five_publisher_inventory_probe.py
      - name: Save source-only findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-five-developer-source-audit
          path: sae-developer-five-existing-original-inventory.json
          if-no-files-found: warn
          retention-days: 7
