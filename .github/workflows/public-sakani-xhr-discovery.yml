name: Public Sakani network unit API shape discovery
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-sakani-xhr-discovery.yml'
      - 'experimental/public_sakani_network_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher-only-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser for isolated Scrapling fetcher
        run: |
          python -m pip install 'scrapling[fetchers]==0.5'
          scrapling install
      - name: Source-only public Sakani API shapes
        run: python experimental/public_sakani_network_probe.py
      - name: Upload metadata-only result or halted checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-sakani-xhr-shape-probe
          path: ${{ runner.temp }}/public-sakani-unit-api-shapes.json
          if-no-files-found: warn
          retention-days: 2
