name: SAE 22 Original Source Families Deep Unit UI XHR
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - 'tools/sae_22_source_deep_unit_ui_xhr_discovery.py'
      - 'tools/sae_22_host_high_density_deep_ui_manifest_20261030.json'
      - '.github/workflows/sae-22-source-deep-unit-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-portfolio-deep-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Inspect 22 original publishers and 37 existing project unit surfaces
        run: python tools/sae_22_source_deep_unit_ui_xhr_discovery.py
      - name: Archive firstparty original unit links and XHR proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-22-original-source-unit-ui-xhr
          path: sae-22-host-original-deep-unit-ui-source.json
          retention-days: 7
          if-no-files-found: warn
