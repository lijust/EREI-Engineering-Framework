name: SAE Kooheji Three Existing Project Brochure Sources
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_kooheji_3_other_brochure_links.py
      - .github/workflows/sae-kooheji-three-brochure-links.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - run: python tools/sae_kooheji_3_other_brochure_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sae-kooheji-three-existing-original-brochure-links
          path: sae-kooheji-three-existing-brochure-links.json
          retention-days: 7
