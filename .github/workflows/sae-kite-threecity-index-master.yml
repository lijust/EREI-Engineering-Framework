name: SAE Kite Existing Master Three-City Scrapling Original Indexed Unit Source
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - 'tools/sae_kite_existing_master_3city_scrapling_index.py'
      - 'tools/sae_kite_existing_master_only_index_20261030.json'
      - '.github/workflows/sae-kite-threecity-index-master.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-existing-project-source-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Scrapling
        run: python -m pip install 'scrapling[fetchers]>=0.5,<0.6'
      - name: Crawl original public Kite project indexes and identify real listing links
        run: python tools/sae_kite_existing_master_3city_scrapling_index.py
      - name: Persist original source project crosswalk and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-kite-existing-original-index-source-only
          path: sae-kite-existing-master-index-paginated-original-links.json
          retention-days: 7
          if-no-files-found: warn
