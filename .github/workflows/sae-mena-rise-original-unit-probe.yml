name: SAE Mena Rise original public per-unit inventory
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - 'tools/sae_mena_rise_original_unit_probe.py'
      - '.github/workflows/sae-mena-rise-original-unit-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Inspect only original public Menaco Rise apartment cards
        run: python tools/sae_mena_rise_original_unit_probe.py
      - name: Save original source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-mena-rise-original-inventory
          path: sae-mena-rise-native-original-unit-cards.json
          retention-days: 7
          if-no-files-found: warn
