name: SAE Retal Verse Project-level Numbered Unit Inventory Exploration
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_retal_verse_actual_project_unit_drill.py
      - .github/workflows/sae-retal-verse-project-unit-drill.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - run: python tools/sae_retal_verse_actual_project_unit_drill.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sae-retal-verse-nesaj-lazurd-original-public-drill
          path: sae-retal-verse-nesaj-lazurd-drilldown.json
          retention-days: 7
