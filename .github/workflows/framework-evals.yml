name: Framework Evals

on:
  pull_request:
    paths:
      - "evals/**"
      - "skills/**/evals/**"
      - "workflows/**/evals/**"
      - "overlays/**/evals/**"
      - "adr/ADR-0001-EVAL-HARNESS.md"
      - ".github/workflows/framework-evals.yml"
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "skills/**/evals/**"
      - "workflows/**/evals/**"
      - "overlays/**/evals/**"
      - ".github/workflows/framework-evals.yml"

permissions:
  contents: read

jobs:
  harness-self-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify GitHub-hosted Python 3.12
        shell: powershell
        run: |
          python -c "import sys, encodings, ssl; print(sys.version); print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile runner
        shell: powershell
        run: python -m py_compile evals/runner.py evals/fixtures/mock_adapter.py evals/tests/test_runner.py

      - name: Run harness unit smoke tests
        shell: powershell
        run: python -m unittest discover -s evals/tests -v

      - name: Validate all machine-readable eval suites
        shell: powershell
        run: python evals/runner.py validate evals/cases
