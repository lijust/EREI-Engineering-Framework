name: Framework Evals

on:
  pull_request:
    paths:
      - "evals/**"
      - "skills/**/evals/**"
      - "workflows/**/evals/**"
      - "overlays/**/evals/**"
      - "adr/ADR-0001-EVAL-HARNESS.md"
      - ".github/workflows/framework-evals.yml"
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "skills/**/evals/**"
      - "workflows/**/evals/**"
      - "overlays/**/evals/**"
      - ".github/workflows/framework-evals.yml"

permissions:
  contents: read

jobs:
  harness-self-test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify local Python 3.12
        shell: pwsh
        run: |
          py "-3.12" -c "import sys, encodings, ssl; print(sys.version); print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile runner
        shell: pwsh
        run: py "-3.12" -m py_compile evals/runner.py evals/fixtures/mock_adapter.py evals/tests/test_runner.py

      - name: Run harness unit smoke tests
        shell: pwsh
        run: py "-3.12" -m unittest discover -s evals/tests -v

      - name: Validate all machine-readable eval suites
        shell: pwsh
        run: py "-3.12" evals/runner.py validate evals/cases
