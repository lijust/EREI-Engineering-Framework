name: Public Alsoliman source unit-project link discovery
on:
  push:
    branches: [experiment/public-scrapling-v05-smoke-20261027]
    paths: [experimental/public_alsoliman_source_project_link_discovery.py, .github/workflows/public-alsoliman-project-link-discovery.yml]
permissions:
  contents: read
jobs:
  source-links:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5' 'lxml>=5,<7'
      - run: python experimental/public_alsoliman_source_project_link_discovery.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alsoliman-developer-publisher-source-links
          path: ${{ runner.temp }}/alsoliman-selling-source-projects.json
          retention-days: 7
