name: Public Al Soliman Aress132 real unit cards
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-alsoliman132-units.yml'
      - 'experimental/public_alsoliman132_units.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firstparty-unit-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/public_alsoliman132_units.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alsoliman132-original-unit-cards
          path: ${{ runner.temp }}/alsoliman132_firstparty_itemized_cards.json
          if-no-files-found: warn
          retention-days: 2
