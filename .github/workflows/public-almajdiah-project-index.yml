name: Public Almajdiah project index discovery
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-almajdiah-project-index.yml'
      - 'experimental/public_almajdiah_project_index.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-index:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/public_almajdiah_project_index.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-almajdiah-project-index-lookup
          path: ${{ runner.temp }}/public-almajdiah-project-catalog-discovery.json
          if-no-files-found: warn
          retention-days: 2
