name: SAE Alsoliman Elite 131 official source inventory discovery
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_alsoliman_131_original_links.py
      - .github/workflows/sae-alsoliman-131-original.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Inspect public project 131 documents and portal
        run: python tools/sae_alsoliman_131_original_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sae-alsoliman-131-original-source-links
          path: sae-alsoliman-original-131-links.json
          retention-days: 7
