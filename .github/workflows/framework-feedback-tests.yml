name: Framework Feedback Tests

on:
  pull_request:
    paths:
      - "schemas/framework-feedback.schema.json"
      - "tools/capture_framework_feedback.py"
      - "tools/tests/test_capture_framework_feedback.py"
      - "skills/framework-feedback-capture/**"
      - "workflows/knowledge-promotion/**"
      - "templates/project-bootstrap/.erei/feedback/**"
      - ".github/workflows/framework-feedback-tests.yml"
  push:
    branches: [main]
    paths:
      - "schemas/framework-feedback.schema.json"
      - "tools/capture_framework_feedback.py"
      - "tools/tests/test_capture_framework_feedback.py"
      - "skills/framework-feedback-capture/**"
      - "workflows/knowledge-promotion/**"
      - "templates/project-bootstrap/.erei/feedback/**"
      - ".github/workflows/framework-feedback-tests.yml"

permissions:
  contents: read

jobs:
  feedback:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile feedback tooling
        run: python -m py_compile tools/capture_framework_feedback.py tools/tests/test_capture_framework_feedback.py

      - name: Run feedback unit tests
        run: python -m unittest tools.tests.test_capture_framework_feedback -v
