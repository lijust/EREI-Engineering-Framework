name: PR61 Reconstructible Evidence Exact-SHA Hosted Source Test
on:
  push:
    branches:
      - verification/pr61-reconstructible-evidence-20261016
permissions:
  contents: read
jobs:
  independent-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7b3736f5db0bfe683ace1f5d34f17f0263a4d9d4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact PR source SHA
        run: test "$(git rev-parse HEAD)" = "7b3736f5db0bfe683ace1f5d34f17f0263a4d9d4"
      - name: Compile Framework and adapter
        run: python -m compileall -q tools evals validation_contract.py
      - name: Framework tooling tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Eval and adapter tests
        run: python -m unittest discover -s evals/tests -p 'test_*.py' -v
      - name: Validate published suites
        run: python evals/runner.py validate evals/cases
      - name: Run all 75 reference-contract cases
        run: python evals/runner.py run evals/cases --adapter "python evals/fixtures/reference_oracle_adapter.py"
