name: Probe Copilot runtime

on:
  push:
    branches:
      - ops/probe-copilot-runtime-20261016

permissions:
  contents: read
  copilot-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: npm install -g @github/copilot@1.0.98
      - name: Show CLI model/help surface
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          copilot --version
          echo '--- help ---'
          copilot --help
          echo '--- models command ---'
          copilot models
          exit 0

