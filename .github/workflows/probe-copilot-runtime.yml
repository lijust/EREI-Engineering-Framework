name: Probe Copilot runtime

on:
  push:
    branches:
      - ops/probe-copilot-runtime-20261016

permissions:
  contents: read
  copilot-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: npm install -g @github/copilot@1.0.98
      - name: Probe default runtime identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot --version
          copilot --no-custom-instructions --no-ask-user             --usage-output-file /tmp/copilot-usage.json             -p "Return exactly: RC3_USAGE_OK" -s
          echo '--- usage ---'
          cat /tmp/copilot-usage.json

