name: Probe Copilot runtime

on:
  push:
    branches:
      - ops/probe-copilot-runtime-20261016

permissions:
  contents: read
  copilot-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: npm install -g @github/copilot@1.0.98
      - name: Probe exact RC3 flags and fixed model
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          copilot --version
          echo '--- gpt-5.4 exact flags ---'
          copilot --model gpt-5.4 --no-custom-instructions --no-ask-user -p "Return exactly: RC3_MODEL_OK" -s
          code=$?
          echo "exit_code=$code"
          echo '--- default exact flags ---'
          copilot --no-custom-instructions --no-ask-user -p "Return exactly: RC3_DEFAULT_OK" -s
          code2=$?
          echo "default_exit_code=$code2"
          exit 0
