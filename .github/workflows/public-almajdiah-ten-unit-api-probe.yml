name: Public Almajdiah ten original unit API probe
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-almajdiah-ten-unit-api-probe.yml'
      - 'experimental/public_almajdiah_ten_units_api_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firstparty-ten-api-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/public_almajdiah_ten_units_api_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-almajdiah-ten-original-unit-api-probe
          path: ${{ runner.temp }}/almajdiah_ten_source_unit_api_probe.json
          if-no-files-found: warn
          retention-days: 2
