name: SAE Modn native source tables
on:
  push:
    branches: [sae-source-study-20261029]
    paths: [tools/sae_modn_original_native_tables.py, .github/workflows/sae-modn-source.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - run: python tools/sae_modn_original_native_tables.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sae-modn-native-table-source
          path: sae-modn-four-native-tables-source.json
