name: SAE Alsoliman 131 Original Public Selling Portal Discovery
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_alsoliman_project131_firstparty_portal.py
      - .github/workflows/sae-alsoliman131-native-selling.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - run: python tools/sae_alsoliman_project131_firstparty_portal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sae-alsoliman131-public-sale-original-portal
          path: sae-alsoliman-131-public-portal-source.json
          retention-days: 7
