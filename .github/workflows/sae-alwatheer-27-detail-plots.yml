name: SAE AlWatheer Existing Project 27 Individually Linked Public Plot Details
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - 'tools/sae_alwatheer_27_source_detail_cards.py'
      - 'tools/sae_alwatheer_original_plot_manifest_20261030.json'
      - '.github/workflows/sae-alwatheer-27-detail-plots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-original-parcel-details:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Capture firstparty original land parcel details strictly from index-linked URLs
        run: python tools/sae_alwatheer_27_source_detail_cards.py
      - name: Preserve exact source pages and parse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-alwatheer-27-original-land-parcel-details
          path: sae-alwatheer-27-original-public-details.json
          retention-days: 7
          if-no-files-found: warn
