name: SAE AlWatheer Existing Jazan Original Individual Land-Plot Pagination
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - 'tools/sae_alwatheer_original_43_parcel_pagination.py'
      - '.github/workflows/sae-alwatheer-existing-original-parcels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Extract original public seller parcel URLs and card identity
        run: python tools/sae_alwatheer_original_43_parcel_pagination.py
      - name: Preserve original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-alwatheer-jazan-original-parcels
          path: sae-alwatheer-301871-original-public-pagination.json
          retention-days: 7
          if-no-files-found: warn
