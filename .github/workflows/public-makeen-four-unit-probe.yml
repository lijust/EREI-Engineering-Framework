name: Public Asas Makeen 4 exact unit page probe
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-makeen-four-unit-probe.yml'
      - 'experimental/public_makeen_four_unit_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-original-project-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/public_makeen_four_unit_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makeen-4-public-unit-page-dom
          path: ${{ runner.temp }}/makeen_four_firstparty_unit_page_probe.json
          if-no-files-found: warn
          retention-days: 2
