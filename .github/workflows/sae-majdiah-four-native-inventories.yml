name: SAE four Almajdiah existing projects Scrapling full original unit API
on:
  push:
    branches: [sae-source-study-20261029]
    paths: [tools/sae_majdiah_four_native_api_bulk.py, .github/workflows/sae-majdiah-four-native-inventories.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5.0' curl_cffi
      - name: Test publisher-native itemized inventory on four exact existing project IDs
        run: python tools/sae_majdiah_four_native_api_bulk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sae-majdiah-four-original-unit-native-apis
          path: sae-majdiah-four-exact-original-unit-inventories.json
          retention-days: 7
