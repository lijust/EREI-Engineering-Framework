name: SAE original 2025 Alargan four public siteplan PDFs
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_argan_2025_real_pdf_maps.py
      - .github/workflows/sae-argan-real-2025-pdf-maps.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  siteplans:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: python -m pip install pymupdf==1.26.4 pillow
      - name: Inspect developer 2025 PDFs and numbered map evidence
        run: python tools/sae_argan_2025_real_pdf_maps.py
      - name: Archive source-only full audit and page previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-argan-2025-original-four-pdf-siteplan-audit
          path: |
            sae-argan-2025-real-brochure-siteplan-audit.json
            sae-argan-real-*.png
          retention-days: 7
