name: Public Almajdiah 158 163 140 Scrapling API snapshots
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-scrapling-almajdiah-three-projects.yml'
      - 'experimental/scrapling_almajdiah_three_project_units.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-units:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/scrapling_almajdiah_three_project_units.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-almajdiah-three-original-project-cards
          path: ${{ runner.temp }}/public-almajdiah-three-projects-cards.json
          if-no-files-found: warn
          retention-days: 1
