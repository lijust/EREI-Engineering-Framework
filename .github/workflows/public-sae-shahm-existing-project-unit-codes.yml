name: SAE Shahm existing firstparty per-unit floor area source discovery
on:
  push:
    branches: [experiment/public-scrapling-v05-smoke-20261027]
    paths:
      - experimental/site_intelligence_shahm_original_unit_codes.py
      - .github/workflows/public-sae-shahm-existing-project-unit-codes.yml
permissions:
  contents: read
jobs:
  published-original-codes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5' 'lxml>=5,<7' 'beautifulsoup4>=4,<5'
      - run: python experimental/site_intelligence_shahm_original_unit_codes.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shahm-firstparty-exact-unit-number-floor-area-source-capture
          path: ${{ runner.temp }}/shahm-source-intelligence-public-original-individual-codes.json
          retention-days: 14
