name: PR59 Exact-SHA Independent Source Tests

on:
  push:
    branches:
      - verification/pr59-github-hosted-exact-20261016

permissions:
  contents: read

jobs:
  independent-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed PR59 SHA
        uses: actions/checkout@v4
        with:
          ref: 51b0f5bd35cc872fc60b68e144342b9178757325
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert exact SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "51b0f5bd35cc872fc60b68e144342b9178757325"
          echo "VALIDATED_SHA=$(git rev-parse HEAD)"
          git status --porcelain

      - name: Compile Framework tools and evals
        run: python -m compileall -q tools evals validation_contract.py validate_framework_feedback.py capture_framework_feedback.py

      - name: Run all Framework tooling regression tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Run evaluation harness regression tests
        run: python -m unittest discover -s evals/tests -p 'test_*.py' -v

      - name: Validate all published eval suite contracts
        run: python evals/runner.py validate evals/cases

      - name: Execute all published reference-contract eval cases
        run: python evals/runner.py run evals/cases --adapter "python evals/fixtures/reference_oracle_adapter.py"
