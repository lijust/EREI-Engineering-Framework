name: Public Kite Saudi 3-city public project index source scan
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-kite-index-scan-source-links.yml'
      - 'experimental/public_kite_project_index_source_scan.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index-source-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5' 'lxml>=5,<7'
      - name: Source-only public project catalog
        run: |
          python experimental/public_kite_project_index_source_scan.py \
            --out "$RUNNER_TEMP/kite-index-project-url-names.json" \
            --delay 2.25 --max-pages-per-city 40
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kite-public-three-city-project-discovery
          path: ${{ runner.temp }}/kite-index-project-url-names.json
          if-no-files-found: warn
          retention-days: 7
