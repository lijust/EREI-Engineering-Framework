name: Public RAZ Elevate original numbered apartment cards
on:
  push:
    branches: [experiment/public-scrapling-v05-smoke-20261027]
    paths: [experimental/public_raz_elevate_com4_original_source_cards.py, .github/workflows/public-raz-elevate-firstparty-cards.yml]
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5' 'lxml>=5,<7' 'beautifulsoup4>=4,<5'
      - run: python experimental/public_raz_elevate_com4_original_source_cards.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-raz-elevate-itemized-cards
          path: ${{ runner.temp }}/raz-elevate-original-com4-unit-cards.json
          retention-days: 7
