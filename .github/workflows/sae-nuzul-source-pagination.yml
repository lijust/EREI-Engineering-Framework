name: SAE Nuzul public project-unit pagination discovery
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_nuzul_existing_project_pagination.py
      - .github/workflows/sae-nuzul-source-pagination.yml
  workflow_dispatch:

permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Inspect existing public publisher project unit grids
        run: python tools/sae_nuzul_existing_project_pagination.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sae-nuzul-existing-four-project-pagination
          path: sae-nuzul-pagination-public-source.json
          retention-days: 7
