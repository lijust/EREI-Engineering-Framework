name: Public Almajdiah bulk original unit cards
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-almajdiah-bulk-firstparty.yml'
      - 'experimental/public_almajdiah_bulk_groups.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-source-cards:
    strategy:
      fail-fast: false
      matrix:
        group: [g1, g2, g3, g4]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/public_almajdiah_bulk_groups.py ${{ matrix.group }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-almajdiah-firstparty-${{ matrix.group }}-units
          path: ${{ runner.temp }}/almajdiah_firstparty_${{ matrix.group }}_source_cards.json
          if-no-files-found: warn
          retention-days: 3
