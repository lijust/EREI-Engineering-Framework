name: SAE Six Existing NHC Projects Original Inventory Assets
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_nhc_six_existing_original_assets.py
      - .github/workflows/sae-nhc-six-original-project-assets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - run: python tools/sae_nhc_six_existing_original_assets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sae-nhc-six-existing-official-project-assets
          path: sae-nhc-six-existing-firstparty-plots-source-study.json
          retention-days: 7
