name: SAE 36 existing projects tiered multi-publisher source sweep (read only)
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_36_source_tiered_sweep.py
      - tools/sae_existing_source_sweep_manifest_20261029.json
      - .github/workflows/sae-36-source-sweep.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public publisher browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Run source-only tiered inventory intelligence across 36 existing projects
        run: python tools/sae_36_source_tiered_sweep.py
      - name: Preserve source-response receipts and project source-card copies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-36-existing-projects-source-sweep
          path: sae-36-source-tiered-sweep.json
          if-no-files-found: warn
          retention-days: 7
