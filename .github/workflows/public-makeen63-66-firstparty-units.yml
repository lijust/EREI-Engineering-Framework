name: Public Makeen63 66 original itemized units
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-makeen63-66-firstparty-units.yml'
      - 'experimental/public_makeen63_66_firstparty_units.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher-unit-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/public_makeen63_66_firstparty_units.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makeen63-66-firstparty-publisher-unit-cards
          path: ${{ runner.temp }}/makeen63_66_firstparty_issued_unit_cards.json
          if-no-files-found: warn
          retention-days: 2
