name: SAE Osus two existing projects full public load-more capture
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_osus_two_public_load_more_capture.py
      - .github/workflows/sae-osus-existing-full-grid.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-browser dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Capture original unit cards from public inventory controls only
        run: python tools/sae_osus_two_public_load_more_capture.py
      - name: Preserve audit source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-osus-existing-two-full-source-snapshot
          path: sae-osus-existing-two-unit-grid-capture.json
          if-no-files-found: warn
          retention-days: 7
