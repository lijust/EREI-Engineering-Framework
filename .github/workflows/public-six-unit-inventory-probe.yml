name: Public six unit inventory sources probe
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-six-unit-inventory-probe.yml'
      - 'experimental/public_six_unit_inventory_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-six-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/public_six_unit_inventory_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-public-source-units-html-checkpoint
          path: ${{ runner.temp }}/sae-public-six-source-units-dom-probe.json
          if-no-files-found: warn
          retention-days: 2
