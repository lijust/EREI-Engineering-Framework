name: Public Almajdiah 147 Scrapling per-unit API pilot
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-scrapling-almajdiah-unit-pages.yml'
      - 'experimental/scrapling_almajdiah_firstparty_unit_pages.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  individual-publisher-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - name: Extract first-party public physical unit cards, stop on HTTP429
        run: python experimental/scrapling_almajdiah_firstparty_unit_pages.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-almajdiah147-original-physical-source-cards
          path: ${{ runner.temp }}/public-almajdiah147-firstparty-unit-pages.json
          if-no-files-found: warn
          retention-days: 1
