name: Public Kite unit page shape probe
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-kite-page-shape-probe.yml'
      - 'experimental/public_kite_units_page_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kite-public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/public_kite_units_page_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-kite-html-shape
          path: ${{ runner.temp }}/kite-public-firstparty-page-probe.json
          if-no-files-found: warn
          retention-days: 2
