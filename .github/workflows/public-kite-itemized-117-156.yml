name: Public Kite itemized 117-156 source cards pilot
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-kite-itemized-117-156.yml'
      - 'experimental/public_kite_unit_inventory_generic.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-listing-index:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5' 'lxml>=5,<7'
      - run: |
          python experimental/public_kite_unit_inventory_generic.py \
            --output "$RUNNER_TEMP/kite-public-original-listing-links.json" \
            --delay 2.5 --max-listings 100
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kite-public-117-156-original-itemized-source-links
          path: ${{ runner.temp }}/kite-public-original-listing-links.json
          if-no-files-found: warn
          retention-days: 5
