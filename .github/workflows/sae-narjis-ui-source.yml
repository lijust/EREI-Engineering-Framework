name: SAE public Narjis map UI source evidence
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_narjis_ui_map_probe.py
      - .github/workflows/sae-narjis-ui-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Capture public map evidence after tutorial controls
        run: python tools/sae_narjis_ui_map_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sae-narjis-map-public-ui-source
          path: |
            sae-narjis-original-public-ui.json
            sae-narjis-map-*.png
          retention-days: 7
