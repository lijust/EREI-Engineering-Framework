name: Public AJWD41 original building and unit identity discovery
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-ajwd41-firstparty-exact-unit-links.yml'
      - 'experimental/public_ajwd41_exact_buildings.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher-firstparty-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - name: Fetch project and exact original publisher building/unit links
        run: python experimental/public_ajwd41_exact_buildings.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ajwd41-building-links-and-unit-cards
          path: ${{ runner.temp }}/ajwd41_firstparty_building_unit_links.json
          retention-days: 3
          if-no-files-found: warn
