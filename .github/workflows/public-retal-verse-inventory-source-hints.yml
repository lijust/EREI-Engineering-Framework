name: Public Retal Verse source-only numbered-unit API discovery
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-retal-verse-inventory-source-hints.yml'
      - 'experimental/public_retal_verse_unit_api_hints.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retal-verse-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5' 'lxml>=5,<7'
      - run: python experimental/public_retal_verse_unit_api_hints.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-retal-verse-source-api-hints
          path: ${{ runner.temp }}/retal-verse-structural-public-api-hints.json
          if-no-files-found: warn
          retention-days: 7
