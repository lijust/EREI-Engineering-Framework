name: Framework Assurance Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'hardening/**'
      - 'release/**'

permissions:
  contents: read

jobs:
  assurance:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify local Python 3.12
        shell: pwsh
        run: |
          py "-3.12" -c "import sys, encodings, ssl; print(sys.version); print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile Framework Python
        shell: pwsh
        run: py "-3.12" -m compileall -q tools evals validation_contract.py validate_framework_feedback.py capture_framework_feedback.py

      - name: Parse all published JSON contracts
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          paths = sorted(Path('schemas').rglob('*.json')) + sorted(Path('evals').rglob('*.schema.json'))
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print('PASS JSON', path)
          '@ | py "-3.12" -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run all Framework tool tests
        shell: pwsh
        run: py "-3.12" -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Validate repository-local assurance references
        shell: pwsh
        run: py "-3.12" tools/validate_project_assurance_refs.py --target .

      - name: Run eval harness tests
        shell: pwsh
        run: py "-3.12" -m unittest discover -s evals/tests -p 'test_*.py' -v

      - name: Validate all machine-readable eval suites
        shell: pwsh
        run: py "-3.12" evals/runner.py validate evals/cases

      - name: Execute all 44 cases at reference-contract level
        shell: pwsh
        run: py "-3.12" evals/runner.py run evals/cases --adapter "py -3.12 evals/fixtures/reference_oracle_adapter.py"

      - name: Report retained execution-evidence coverage honestly
        shell: pwsh
        run: |
          $evidenceFiles = Get-ChildItem -Path 'evals' -Filter 'EXECUTION_EVIDENCE*.json' | Sort-Object Name
          foreach ($evidence in $evidenceFiles) {
            Write-Host "EVIDENCE $($evidence.FullName)"
            py "-3.12" evals/runner.py coverage evals/cases --evidence $evidence.FullName --minimum-level exact_target_runtime
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate structured central feedback decisions
        shell: pwsh
        run: py "-3.12" tools/feedback_decisions.py validate feedback/DECISIONS.jsonl

      - name: Validate current prospective learning-cycle progress
        shell: pwsh
        run: py "-3.12" tools/prospective_cycle_status.py learning/PROSPECTIVE_CYCLE_STATUS.json

      - name: Validate truthful assurance enforcement state
        shell: pwsh
        run: py "-3.12" tools/assurance_enforcement.py security/ASSURANCE_ENFORCEMENT.json

      - name: Validate frozen release-target closure when selected
        shell: pwsh
        run: py "-3.12" tools/release_target.py --repo-root . --if-present --validate-closure

      - name: Report derived VNext Stable readiness
        shell: pwsh
        run: py "-3.12" tools/stable_readiness.py --repo-root .

      - name: Validate last Stable release manifest
        shell: pwsh
        run: py "-3.12" tools/release_assurance.py releases/task-learning-review-v1.json --repo-root .

      - name: Validate grandfathered last Stable carrier provenance
        shell: pwsh
        run: |
          $carrierRef = (git rev-parse origin/main).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py "-3.12" tools/stable_release_carrier.py --framework-repo . --target-ref 69079018606750312344cb3c648952b9ab72d35b --release-carrier-ref $carrierRef
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate VNext Candidate manifest
        shell: pwsh
        run: py "-3.12" tools/release_assurance.py releases/vnext-assurance-candidate.json --repo-root .

      - name: Validate capability registry
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          data = json.loads(Path('CAPABILITIES.json').read_text(encoding='utf-8'))
          assert data['schema_version'] == 1
          assert len(data['stable_release']['framework_ref']) == 40
          assert data['development_line']['status'] == 'candidate'
          print('PASS capability registry')
          '@ | py "-3.12" -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
