name: Public Scrapling v0.5 runtime smoke (isolated experiment)
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-scrapling-v05-smoke.yml'
      - 'experimental/scrapling_public_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-scrapling-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  basic-scrapling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Scrapling v0.5 fetchers
        run: python -m pip install 'scrapling[fetchers]==0.5'
      - name: Run generic public HTML smoke test
        run: python experimental/scrapling_public_smoke.py
