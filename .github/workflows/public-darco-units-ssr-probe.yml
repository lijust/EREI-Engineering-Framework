name: Public Darco original 1278 apartment SSR pagination probe
on:
  push:
    branches: [experiment/public-scrapling-v05-smoke-20261027]
    paths: [.github/workflows/public-darco-units-ssr-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firstparty-ssr:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/public_darco_firstparty_units_ssr_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darco-ssr-3-firstparty-unit-pages
          path: ${{ runner.temp }}/darco_units_three_pages_ssr_shape.json
          if-no-files-found: warn
          retention-days: 3
