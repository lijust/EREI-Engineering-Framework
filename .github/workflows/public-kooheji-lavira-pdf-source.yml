name: Public Kooheji Lavira two official PDF unit tables
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-kooheji-lavira-pdf-source.yml'
      - 'experimental/public_kooheji_lavira_pdf_unit_tables.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher-pdf-unit-table-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source PDF parser and Scrapling
        run: python -m pip install 'scrapling[fetchers]==0.5' 'pymupdf>=1.24,<1.28'
      - name: Extract publisher PDF physical numbered units (zero canonical writes)
        run: python experimental/public_kooheji_lavira_pdf_unit_tables.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kooheji-lavira-firstparty-itemized-villa-pdf-source-tables
          path: ${{ runner.temp }}/lavira_publisher_pdf_source_tables.json
          retention-days: 3
          if-no-files-found: warn
