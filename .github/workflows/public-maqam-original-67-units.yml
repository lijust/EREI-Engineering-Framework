name: Public Maqam numbered unit source audit
on:
  push:
    branches: [experiment/public-scrapling-v05-smoke-20261027]
    paths: [experimental/public_maqam_original_67_exact_cards.py, .github/workflows/public-maqam-original-67-units.yml]
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5' 'lxml>=5,<7' 'beautifulsoup4>=4,<5'
      - run: python experimental/public_maqam_original_67_exact_cards.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maqam-original-exact-cards
          path: ${{ runner.temp }}/maqam-source-original-numbered-units.json
          retention-days: 5
