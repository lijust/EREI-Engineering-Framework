name: Public Wakan four published original unit cards probe
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-wakan-four-probe.yml'
      - 'experimental/public_wakan_four_firstparty_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/public_wakan_four_firstparty_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-wakan-four-public-page-probe
          path: ${{ runner.temp }}/wakan_four_original_inventory_probe.json
          if-no-files-found: warn
          retention-days: 2
