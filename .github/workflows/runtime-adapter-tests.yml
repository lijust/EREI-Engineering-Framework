name: Runtime Adapter Tests

on:
  pull_request:
    paths:
      - "schemas/RUNTIME_ADAPTER_CONTRACT.md"
      - "schemas/runtime-adapter.schema.json"
      - "tools/validate_runtime_adapter.py"
      - "tools/tests/test_validate_runtime_adapter.py"
      - "adapters/**"
      - "evals/cases/runtime-adapter-contract.eval.json"
      - "evals/fixtures/runtime-adapter-candidate.json"
      - ".github/workflows/runtime-adapter-tests.yml"
  push:
    branches: [main]
    paths:
      - "schemas/RUNTIME_ADAPTER_CONTRACT.md"
      - "schemas/runtime-adapter.schema.json"
      - "tools/validate_runtime_adapter.py"
      - "tools/tests/test_validate_runtime_adapter.py"
      - "adapters/**"
      - "evals/cases/runtime-adapter-contract.eval.json"
      - "evals/fixtures/runtime-adapter-candidate.json"
      - ".github/workflows/runtime-adapter-tests.yml"

permissions:
  contents: read

jobs:
  runtime-adapter-contract:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify local Python
        shell: pwsh
        run: |
          py "-${{ matrix.python-version }}" -c "import sys, encodings, ssl; print(sys.version); print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile validator
        shell: pwsh
        run: py "-${{ matrix.python-version }}" -m py_compile tools/validate_runtime_adapter.py tools/tests/test_validate_runtime_adapter.py

      - name: Run validator unit tests
        shell: pwsh
        run: py "-${{ matrix.python-version }}" -m unittest tools.tests.test_validate_runtime_adapter -v

      - name: Validate candidate fixture
        shell: pwsh
        run: py "-${{ matrix.python-version }}" tools/validate_runtime_adapter.py evals/fixtures/runtime-adapter-candidate.json
