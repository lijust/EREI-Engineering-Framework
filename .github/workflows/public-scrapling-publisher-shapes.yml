name: Public first-party Scrapling HTML/XHR shapes (isolated experiment)
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-scrapling-publisher-shapes.yml'
      - 'experimental/scrapling_public_publisher_shapes.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher-shapes:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'scrapling[fetchers]==0.5'
          scrapling install
      - run: python experimental/scrapling_public_publisher_shapes.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-firstparty-html-xhr-shapes
          path: ${{ runner.temp }}/public-original-publisher-source-shapes.json
          if-no-files-found: warn
          retention-days: 1
