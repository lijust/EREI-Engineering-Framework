name: SAE first-party Argan Fursan Green Oasis siteplans
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_argan_fursan_green_oasis_pdf.py
      - .github/workflows/sae-argan-fursan-green-oasis-siteplans.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-brochure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF inspection tools
        run: python -m pip install pymupdf pillow
      - name: Inspect only original public developer PDFs
        run: python tools/sae_argan_fursan_green_oasis_pdf.py
      - name: Save source-only inspection and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-argan-fursan-green-oasis-original-pdf-maps
          path: |
            sae-argan-fursan-green-oasis-public-brochures.json
            sae-argan-PRJ-*-contact.png
          retention-days: 7
