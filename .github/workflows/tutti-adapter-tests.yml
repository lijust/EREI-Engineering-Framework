name: Tutti Adapter Tests

on:
  pull_request:
    paths:
      - "adapters/tutti/**"
      - "schemas/runtime-adapter.schema.json"
      - "schemas/RUNTIME_ADAPTER_CONTRACT.md"
      - "tools/validate_runtime_adapter.py"
      - ".github/workflows/tutti-adapter-tests.yml"
  push:
    branches: [main]
    paths:
      - "adapters/tutti/**"
      - "schemas/runtime-adapter.schema.json"
      - "schemas/RUNTIME_ADAPTER_CONTRACT.md"
      - "tools/validate_runtime_adapter.py"
      - ".github/workflows/tutti-adapter-tests.yml"

permissions:
  contents: read

jobs:
  tutti-adapter:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile adapter
        run: python -m py_compile adapters/tutti/implementation/tutti_adapter.py adapters/tutti/implementation/tests/test_tutti_adapter.py

      - name: Validate adapter manifest
        run: python tools/validate_runtime_adapter.py adapters/tutti/adapter.json

      - name: Run adapter unit tests
        run: python -m unittest discover -s adapters/tutti/implementation/tests -v
