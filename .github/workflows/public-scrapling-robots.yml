name: Public Scrapling Robots Diagnostic (isolated experiment)
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-scrapling-robots.yml'
      - 'experimental/scrapling_robots_demo.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  robots-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/scrapling_robots_demo.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-scrapling-robots-only
          path: ${{ runner.temp }}/public-publisher-robots-scrapling.json
          if-no-files-found: warn
          retention-days: 1
