name: SAE Ketaf Existing Amlak AlFaisaliyah 12 Original Apartment Identity
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - 'tools/sae_ketaf_12_original_unit_identity_details.py'
      - 'tools/sae_ketaf_12_original_source_listing_manifest.json'
      - '.github/workflows/sae-ketaf-12-original-unit-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firstparty-12-original-details:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser installation
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Verify firstparty apartment identity against original details
        run: python tools/sae_ketaf_12_original_unit_identity_details.py
      - name: Archive all original detailed page source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-ketaf12-original-individual-apartment-source
          path: sae-ketaf12-precise-original-page-unit-identity.json
          retention-days: 7
          if-no-files-found: warn
