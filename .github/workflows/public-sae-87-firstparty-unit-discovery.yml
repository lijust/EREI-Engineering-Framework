name: Public SAE firstparty 87 URLs unit discovery
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-sae-87-firstparty-unit-discovery.yml'
      - 'experimental/public_sae_87_multi_publisher_unit_discovery.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-unit-source-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public Scrapling fetchers
        run: python -m pip install 'scrapling[fetchers]==0.5'
      - name: Run original firstparty itemized table discovery (source-only)
        run: python experimental/public_sae_87_multi_publisher_unit_discovery.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-87-publisher-source-only-unit-candidates
          path: ${{ runner.temp }}/sae_original_87_pages_source_only.json
          if-no-files-found: warn
          retention-days: 5
