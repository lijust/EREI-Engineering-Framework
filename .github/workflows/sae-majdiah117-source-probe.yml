name: SAE firstparty Almajdiah 117 Scrapling source only
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_majdiah117_source_probe.py
      - .github/workflows/sae-majdiah117-source-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5.0' curl_cffi
      - name: Probe unique original Almajdiah 117 unit cards
        run: python tools/sae_majdiah117_source_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sae-majdiah-117-original-public-unit-cards
          path: sae-almajdiah117-firstparty-units.json
          retention-days: 7
