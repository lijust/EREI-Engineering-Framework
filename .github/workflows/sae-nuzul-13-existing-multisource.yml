name: SAE 13 Existing Projects Multi-Source Native Unit Pagination
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - 'tools/sae_nuzul_13_projects_adaptive_original_pagination.py'
      - 'tools/sae_nuzul_existing_13_project_manifest_20261030.json'
      - '.github/workflows/sae-nuzul-13-existing-multisource.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-original-unit-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Run multi-publisher adaptive unit grids
        run: python tools/sae_nuzul_13_projects_adaptive_original_pagination.py
      - name: Archive per-publisher source project and physical-card evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-nuzul-13-multisource-original-unit-inventory
          path: sae-nuzul-13-original-all-pages-public-source.json
          retention-days: 7
          if-no-files-found: warn
