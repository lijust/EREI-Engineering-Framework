name: SAE Townhouse Line original second-page cards
on:
  push:
    branches: [sae-source-study-20261029]
    paths:
      - tools/sae_townhouse_line_page2.py
      - .github/workflows/sae-townhouse-line-page2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - run: python tools/sae_townhouse_line_page2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sae-townhouse-line-3-extra-original-source-cards
          path: sae-townhouse-line-exact-page2.json
          retention-days: 7
