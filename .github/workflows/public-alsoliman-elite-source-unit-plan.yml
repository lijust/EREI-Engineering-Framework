name: Public Alsoliman Elite official numbered residential plan vector probe
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-alsoliman-elite-source-unit-plan.yml'
      - 'experimental/public_alsoliman_elite_2000_original_siteplan_vector_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-official-siteplan-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf>=1.24,<2' 'scrapling[fetchers]==0.5'
      - run: python experimental/public_alsoliman_elite_2000_original_siteplan_vector_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sae-alsoliman-elite-source-vector-number-audit
          path: ${{ runner.temp }}/alsoliman_elite_firstparty_vector_numeric_source_probe.json
          if-no-files-found: warn
          retention-days: 5
