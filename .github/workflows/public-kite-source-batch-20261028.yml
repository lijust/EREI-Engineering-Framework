name: Public Kite source-only discovery batch 20261028
on:
  push:
    branches: [experiment/public-scrapling-v05-smoke-20261027]
    paths: [.github/workflows/public-kite-source-batch-20261028.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'scrapling[fetchers]==0.5'
      - run: python experimental/public_kite_targeted_new_canonical_candidates.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kite-public-source-candidates-20261028
          path: ${{ runner.temp }}/kite-canonical-candidate-firstparty-20261028.json
          if-no-files-found: warn
