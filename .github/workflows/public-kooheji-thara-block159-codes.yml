name: Public Kooheji Thara block159 original villa unit codes
on:
  push:
    branches:
      - experiment/public-scrapling-v05-smoke-20261027
    paths:
      - '.github/workflows/public-kooheji-thara-block159-codes.yml'
      - 'experimental/public_kooheji_thara_block159_exact_villa_codes_v2.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-villa-unit-codes:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf>=1.24,<2' 'scrapling[fetchers]==0.5'
      - run: python experimental/public_kooheji_thara_block159_exact_villa_codes_v2.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-thara-block159-exact-individual-villa-source-codes
          path: ${{ runner.temp }}/sae_thara_exact_source_unit_codes.json
          if-no-files-found: warn
          retention-days: 5
