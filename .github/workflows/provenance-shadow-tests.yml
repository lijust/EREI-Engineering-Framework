name: Provenance shadow tests

on:
  push:
    branches:
      - ops/provenance-shadow-tests-20261016

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dbed2547c5e2cb2761f0bfe5ee1a1628229fbf10
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q tools evals
      - name: Parse JSON
        run: find . -type f -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python -m json.tool >/dev/null
      - name: Run Framework tool tests
        run: python -m unittest discover tools/tests -v
