name: SAE Lavira six original public brochures
on:
  push:
    branches: [sae-source-study-20261029]
    paths: [tools/sae_lavira_six_public_brochure_links.py, .github/workflows/sae-lavira-six-brochures.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - run: python tools/sae_lavira_six_public_brochure_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sae-lavira-six-original-brochure-links
          path: sae-lavira-six-official-subcommunity-links.json
